<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konadi Media - 100 Judul Berita</title>
</head>
<body style="margin: 0; background-color: #0b111e; font-family: Arial, sans-serif; color: #ffffff;">

    <!-- NAVBAR / HEADER -->
    <header style="background: #0e1721; border-bottom: 1px solid #1f293d; padding: 15px 20px; position: sticky; top: 0; z-index: 1000;">
        <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            <h1 style="margin: 0; font-size: 20px; color: #c9a86a;">Konadi Media</h1>
            <nav style="display: flex; gap: 20px;">
                <a href="#" style="color: #ffffff; text-decoration: none; font-size: 14px;">Beranda</a>
                <a href="#" style="color: #94a3b8; text-decoration: none; font-size: 14px;">Arsip 100 Berita</a>
            </nav>
        </div>
    </header>

    <!-- LAYOUT UTAMA DUA KOLOM -->
    <div class="section-container" style="display: flex; gap: 30px; max-width: 1200px; margin: 40px auto; padding: 0 20px;">
        
        <!-- KOLOM KIRI: 100 BERITA (SLIM CARD) -->
        <main style="flex: 2; display: flex; flex-direction: column; gap: 15px;">
            <h3 style="margin: 0 0 10px 0; color: #ffffff; font-size: 18px; border-left: 3px solid #c9a86a; padding-left: 10px;">Arsip Berita Terkini (Total 100 Judul)</h3>
            
            <div style="display: flex; flex-direction: column; gap: 8px;" id="news-list-container">
                <!-- JavaScript otomatis mengisi 100 berita slim card supaya kodenya rapi dan tidak kepanjangan -->
            </div>
        </main>
        
        <!-- KOLOM KANAN: SIDEBAR STICKY -->
        <aside style="flex: 1; position: sticky; top: 80px; height: fit-content; display: flex; flex-direction: column; gap: 20px;">
            
            <!-- Video 1 -->
            <div style="background: #121824; padding: 15px; border-radius: 12px; border: 1px solid #1f293d;">
                 <h4 style="margin: 0 0 10px 0; color: #ffffff; font-size: 14px; border-bottom: 2px solid #d9a441; padding-bottom: 5px;">Kajian Pilihan</h4>
                <div style="position: relative; width: 100%; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px;">
                    <iframe src="https://www.youtube.com/embed/4UZrsTqkcW4" 
                            title="YouTube video player" frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen 
                            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;">
                    </iframe>
                </div>
            </div>

            <!-- Video 2 -->
            <div style="background: #121824; padding: 15px; border-radius: 12px; border: 1px solid #1f293d;">
                <h4 style="margin: 0 0 10px 0; color: #ffffff; font-size: 14px; border-bottom: 2px solid #d9a441; padding-bottom: 5px;">Sholawat & Doa</h4>
                <div style="position: relative; width: 100%; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px;">
                    <iframe src="https://www.youtube.com/embed/3JZ_D3ELwOQ" 
                            title="YouTube video player" frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen 
                            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;">
                    </iframe>
                </div>
            </div>
        </aside>

    </div>

    <!-- SCRIPT OTOMATIS GENERATE 100 KARTU BERITA SLIM -->
    <script>
        const container = document.getElementById('news-list-container');
        const topics = [
            "Keindahan Alam Danau Lut Tawar Takengon",
            "Menikmati Citarasa Kopi Arabika Gayo Asli",
            "Mengenal Sejarah dan Legenda Putri Pukes",
            "Tradisi Adat Reusam Masyarakat Gayo",
            "Pesona Wisata Burni Telong Bener Meriah",
            "Kekayaan Kerajinan Tangan Kerawang Gayo",
            "Mempelajari Gerakan Filosofis Tari Guel",
            "Festival Kopi Internasional di Tanah Gayo"
        ];

        for (let i = 1; i <= 100; i++) {
            let randomTopic = topics[(i - 1) % topics.length];
            let cardHTML = `
                <a href="#" class="card" style="text-decoration: none; display: flex; gap: 12px; align-items: center; background: #0e1721; border: 1px solid #1f293d; border-radius: 6px; padding: 8px;">
                    <div style="width: 90px; height: 60px; background-color: #1a2332; border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #c9a86a; font-size: 11px; font-weight: bold;">IMG ${i}</div>
                    <div style="display: flex; flex-direction: column; gap: 3px; overflow: hidden;">
                        <span style="background: #c9a86a; color: #0b111e; padding: 1px 5px; border-radius: 3px; font-weight: bold; font-size: 9px; width: fit-content;">Berita #${i}</span>
                        <h2 style="color: #ffffff; font-size: 13px; line-height: 1.2; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${randomTopic} - Bagian Ke-${i}</h2>
                        <p style="color: #94a3b8; font-size: 11px; line-height: 1.2; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Informasi lengkap seputar perkembangan dan kabar terbaru dari tanah Gayo...</p>
                    </div>
                </a>
            `;
            container.innerHTML += cardHTML;
        }
    </script>

</body>
</html>
